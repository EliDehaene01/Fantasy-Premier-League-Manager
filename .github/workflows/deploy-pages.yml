# Publishes frontend/ (built with the static JSON frontend-export already
# wrote into frontend/public/data/) to GitHub Pages.
#
# Fires automatically on a push to main that touches frontend/public/data/**
# - the exact path frontend-export/export_gameweek.py writes to (its
# OUTPUT_DIR) - so a new gameweek export goes live without a manual step.
# workflow_dispatch stays available as a manual fallback (e.g. to redeploy
# after a frontend source change with no new data). GitHub Pages must be
# enabled for this repo (Settings -> Pages -> Source: GitHub Actions) for
# `deploy-pages` to have anywhere to publish to - confirmed already enabled
# here (build_type: workflow).
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/public/data/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
