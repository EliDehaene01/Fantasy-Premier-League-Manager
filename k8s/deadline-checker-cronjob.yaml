# ARCHITECTURE.md 8: "runs daily, checks the FPL fixtures endpoint for the
# next deadline; if it's within ~24-36 hours, triggers the pipeline Job."
# `python -m ingestion auto` (ingestion/deadline.py + ingestion/__main__.py)
# does exactly that check against bootstrap-static's per-event deadline_time
# and only calls run_weekly when the next deadline is within the window -
# on every other day this exits after one cheap read-only API call, no DB
# connection opened, no ingestion run. See ingestion/test_deadline.py for
# the no-op-when-far-out behavior verified directly.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: deadline-checker
  namespace: fpl-agents
spec:
  schedule: "0 8 * * *"  # daily at 08:00 - FPL deadlines are irregular days, so this checks every day rather than assuming a fixed weekday
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ingestion
              image: fpl-agents/ingestion:local
              imagePullPolicy: Never
              args: ["auto"]
              envFrom:
                - secretRef: { name: fpl-secrets }
