# TEMPLATE - copy to secret.yaml (already .gitignore'd, never commit real
# values) and fill in before `kubectl apply -f k8s/secret.yaml`. Mirrors the
# same DATABASE_URL / Foundry credential shape already used in the local
# .env (see CLAUDE.md's "Data store" convention) - just delivered via a
# Kubernetes Secret instead of a dotenv file, since pods don't read .env.
apiVersion: v1
kind: Secret
metadata:
  name: fpl-secrets
  namespace: fpl-agents
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:CHANGE-ME@host.docker.internal:5433/postgres"
  MICROSOFT_FOUNDRY_KEY: "CHANGE-ME"
  FPL_CONTENT_SAFETY_ENDPOINT: "CHANGE-ME"  # Azure AI Content Safety resource - Prompt Shields (agents/news/prompt_shields.py)
  FPL_CONTENT_SAFETY_KEY: "CHANGE-ME"
  FPL_TEAM_ID: "CHANGE-ME"  # your real FPL entry id - also read from .env for local/non-k8s runs
