apiVersion: apps/v1
kind: Deployment
metadata:
  name: solver
  namespace: fpl-agents
spec:
  replicas: 1
  selector:
    matchLabels: { app: solver }
  template:
    metadata:
      labels: { app: solver }
    spec:
      containers:
        - name: solver
          image: fpl-agents/solver:local
          imagePullPolicy: Never
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: solver
  namespace: fpl-agents
spec:
  selector: { app: solver }
  ports: [{ port: 8000, targetPort: 8000 }]
