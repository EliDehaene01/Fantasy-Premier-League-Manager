apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  namespace: fpl-agents
spec:
  replicas: 1
  selector:
    matchLabels: { app: manager }
  template:
    metadata:
      labels: { app: manager }
    spec:
      containers:
        - name: manager
          image: fpl-agents/manager:local
          imagePullPolicy: Never
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: fpl-secrets }  # Foundry key, for narration/reaction LLM calls
          env:
            - name: MANAGER_NARRATE_DISABLE_LLM
              value: "1"  # flip to "0" once real Foundry credentials are in secret.yaml
            - name: MANAGER_REACT_DISABLE_LLM
              value: "1"
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: manager
  namespace: fpl-agents
spec:
  selector: { app: manager }
  ports: [{ port: 8000, targetPort: 8000 }]
