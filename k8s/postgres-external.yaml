# ARCHITECTURE.md 8/TODO.md Phase 5: "Decide and document whether Postgres
# runs inside the Kubernetes namespace or stays as the external local
# container already in use." Deliberately EXTERNAL:
#   - the local Docker Desktop cluster exists to demonstrate orchestration
#     skill, not to be a durable data store - a StatefulSet + PVC on a
#     disposable local cluster adds real complexity (volume lifecycle,
#     backup) for no benefit the cluster's own purpose needs;
#   - the standalone `fpl-postgres` container (pgvector/pgvector:pg16,
#     host port 5433) is already the established, working setup this whole
#     project's local dev and backtest engine already depend on;
#   - Docker Desktop's Kubernetes gives every pod a route to the host
#     machine via the `host.docker.internal` DNS name, so "external" isn't
#     a workaround - it's a first-class, documented feature of exactly this
#     local cluster.
# This ExternalName Service lets every in-cluster pod reach it as
# "postgres.fpl-agents.svc.cluster.local:5433" (or just "postgres:5433"
# from within the namespace) instead of hardcoding host.docker.internal
# into every Deployment - one indirection point if the real topology ever
# changes.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fpl-agents
spec:
  type: ExternalName
  externalName: host.docker.internal
