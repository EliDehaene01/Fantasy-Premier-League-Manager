# The Deployment ARCHITECTURE.md 8 describes: a persistent service (not a
# one-shot Job) exposing POST /run + POST /resume (orchestrator/service.py)
# - the ingestion Job calls /run once fresh data lands; the human-approval
# step calls /resume with the reviewed decision.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: fpl-agents
spec:
  replicas: 1
  selector:
    matchLabels: { app: orchestrator }
  template:
    metadata:
      labels: { app: orchestrator }
    spec:
      containers:
        - name: orchestrator
          image: fpl-agents/orchestrator:local
          imagePullPolicy: Never
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: fpl-config }
            - secretRef: { name: fpl-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: fpl-agents
spec:
  selector: { app: orchestrator }
  ports: [{ port: 8000, targetPort: 8000 }]
