# Non-secret configuration: internal service DNS names (ClusterIP Services
# route by name within the namespace, so these are always "http://<service>:8000"
# regardless of which node a pod lands on) and the Foundry endpoint URL
# (not the key - that's secret.yaml). Every Deployment below references
# this via envFrom, so a URL change is one edit, not eleven.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fpl-config
  namespace: fpl-agents
data:
  STATS_AGENT_URL: "http://stats:8000"
  FIXTURES_AGENT_URL: "http://fixtures:8000"
  NEWS_AGENT_URL: "http://news:8000"
  CONTRARIAN_AGENT_URL: "http://contrarian:8000"
  TEMPLATE_AGENT_URL: "http://template:8000"
  CHIPS_AGENT_URL: "http://chips:8000"
  MANAGER_URL: "http://manager:8000"
  # Docker Desktop's Kubernetes reaches the host machine via this special
  # DNS name - see postgres-external.yaml's own comment for why Postgres
  # stays external rather than running inside the cluster.
  POSTGRES_HOST: "host.docker.internal"
  POSTGRES_PORT: "5433"
  MICROSOFT_FOUNDRY_OPENAI_ENDPOINT: "https://CHANGE-ME.openai.azure.com/openai/v1"
