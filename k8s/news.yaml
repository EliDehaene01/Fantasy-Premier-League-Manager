apiVersion: apps/v1
kind: Deployment
metadata:
  name: news
  namespace: fpl-agents
spec:
  replicas: 1
  selector:
    matchLabels: { app: news }
  template:
    metadata:
      labels: { app: news }
    spec:
      containers:
        - name: news
          image: fpl-agents/news:local
          imagePullPolicy: Never
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: fpl-config }
            - secretRef: { name: fpl-secrets }
          env:
            - name: NEWS_AGENT_DISABLE_LLM
              value: "1"  # flip to "0" once real Foundry credentials are in secret.yaml
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: news
  namespace: fpl-agents
spec:
  selector: { app: news }
  ports: [{ port: 8000, targetPort: 8000 }]
