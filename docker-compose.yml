# The sole local deployment mechanism (Kubernetes was tried, deployed
# successfully for several hours, then abandoned - a Docker Desktop
# kind-mode limitation on this machine meant images built here were never
# visible to the cluster's node, with no available workaround; see
# TODO.md's Phase 5 note). `docker compose up -d` brings up every
# persistent service; `docker compose run --rm ingestion <mode>` runs the
# one-shot ingestion CLI (it has no server, so it's excluded from `up -d`
# via the "jobs" profile - see its own service entry below).
#
# Postgres here IS the real database (not a throwaway dev-wiring copy):
# `postgres_data` is an existing external volume already holding real
# ingested season data - `docker compose up -d` reattaches it, it does not
# create a fresh one. Every *_DISABLE_LLM flag below is "1" (no real
# Foundry calls) except News, which has real Prompt Shields/Content Safety
# credentials wired (see docs/foundry_guardrails.md) - the rest were never
# exercised against real Foundry this session and stay mocked, matching
# their prior state.

volumes:
  postgres_data:
    external: true
    name: 3ed8528dbb73f71f20f61e379b70a2c77d700159a6cc0ecc948269a2a93553c2

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: MoveToLondon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    profiles: ["jobs"]  # a one-shot CLI, not a server - run with `docker compose run --rm ingestion <mode>`
    environment:
      DATABASE_URL: postgresql://postgres:MoveToLondon@postgres:5432/postgres
      FPL_TEAM_ID: ${FPL_TEAM_ID}
      ORCHESTRATOR_URL: http://orchestrator:8000
    depends_on:
      postgres:
        condition: service_healthy

  solver:
    build:
      context: .
      dockerfile: solver/Dockerfile
    ports:
      - "8001:8000"

  stats:
    build:
      context: .
      dockerfile: agents/stats/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:MoveToLondon@postgres:5432/postgres
      STATS_AGENT_DISABLE_LLM: "1"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"

  fixtures:
    build:
      context: .
      dockerfile: agents/fixtures/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:MoveToLondon@postgres:5432/postgres
      FIXTURES_AGENT_DISABLE_LLM: "1"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8003:8000"

  news:
    build:
      context: .
      dockerfile: agents/news/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:MoveToLondon@postgres:5432/postgres
      NEWS_AGENT_DISABLE_LLM: "0"
      FPL_CONTENT_SAFETY_ENDPOINT: ${FPL_CONTENT_SAFETY_ENDPOINT}
      FPL_CONTENT_SAFETY_KEY: ${FPL_CONTENT_SAFETY_KEY}
      MICROSOFT_FOUNDRY_OPENAI_ENDPOINT: ${MICROSOFT_FOUNDRY_OPENAI_ENDPOINT}
      MICROSOFT_FOUNDRY_KEY: ${MICROSOFT_FOUNDRY_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8004:8000"

  contrarian:
    build:
      context: .
      dockerfile: agents/contrarian/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:MoveToLondon@postgres:5432/postgres
      CONTRARIAN_AGENT_DISABLE_LLM: "1"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8005:8000"

  template:
    build:
      context: .
      dockerfile: agents/template/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:MoveToLondon@postgres:5432/postgres
      TEMPLATE_AGENT_DISABLE_LLM: "1"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8006:8000"

  chips:
    build:
      context: .
      dockerfile: agents/chips/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:MoveToLondon@postgres:5432/postgres
      CHIPS_AGENT_DISABLE_LLM: "1"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8007:8000"

  manager:
    build:
      context: .
      dockerfile: manager/Dockerfile
    environment:
      MANAGER_NARRATE_DISABLE_LLM: "1"
      MANAGER_REACT_DISABLE_LLM: "1"
    ports:
      - "8008:8000"

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:MoveToLondon@postgres:5432/postgres
      STATS_AGENT_URL: http://stats:8000
      FIXTURES_AGENT_URL: http://fixtures:8000
      NEWS_AGENT_URL: http://news:8000
      CONTRARIAN_AGENT_URL: http://contrarian:8000
      TEMPLATE_AGENT_URL: http://template:8000
      CHIPS_AGENT_URL: http://chips:8000
      MANAGER_URL: http://manager:8000
    depends_on:
      postgres:
        condition: service_healthy
      stats:
        condition: service_started
      fixtures:
        condition: service_started
      news:
        condition: service_started
      contrarian:
        condition: service_started
      template:
        condition: service_started
      chips:
        condition: service_started
      manager:
        condition: service_started
    ports:
      - "8000:8000"
